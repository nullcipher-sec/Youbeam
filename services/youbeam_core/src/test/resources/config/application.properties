# Solo para tests: clave de firma de tickets temporal, generada en memoria en cada arranque.
# Spring Boot carga config/application.properties además del principal y sus valores tienen prioridad.
youbeam.jwt.ephemeral-key=true

# Directorio de subidas exclusivo de los tests, para comprobar que queda vacío tras cada subida
youbeam.upload.temp-dir=${java.io.tmpdir}/youbeam-uploads-test
