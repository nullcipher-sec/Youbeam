# Perfil de desarrollo local

# Carga las variables POSTGRES_* desde deploy/.env local (nunca versionado) si existe.
# Se prueban dos rutas porque IntelliJ puede arrancar desde la raíz del repo o desde el módulo.
spring.config.import=optional:file:./deploy/.env[.properties],optional:file:../../deploy/.env[.properties]

# Clave de firma de tickets generada con openssl (ver docs/GUIA-SEGURIDAD.md, paso 1).
# Se prueban dos rutas porque IntelliJ puede arrancar desde la raíz del repo o desde el módulo.
youbeam.jwt.private-key-locations=${JWT_PRIVATE_KEY_PATH:deploy/secrets/jwt_private.pem,../../deploy/secrets/jwt_private.pem}

# En local el Streaming Server corre en la misma máquina (puerto 8081 por defecto).
youbeam.stream.base-url=${STREAM_URL:http://localhost:8081}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Scalar: documentación interactiva de la API en /scalar; springdoc le pasa /v3/api-docs.
# Sin telemetría ni fuentes externas: todo se sirve desde el propio Core.
scalar.enabled=true
scalar.page-title=YouBeam API
# Tema propio (theme=none) con los colores del front; el CSS lo carga ScalarThemeConfig.
scalar.theme=none
scalar.telemetry=false
# Sin agente de IA ni barra de herramientas (Share, Generate SDKs): ambos envían la
# especificación a servicios de Scalar, y la documentación de la API no debe salir del Core.
scalar.agent.disabled=true
scalar.show-developer-tools=never
scalar.with-default-fonts=false

logging.level.com.youbeam.core=DEBUG
