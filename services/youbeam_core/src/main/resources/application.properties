spring.application.name=youbeam-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${CORE_PORT:8080}
spring.threads.virtual.enabled=true

# Las respuestas de error no deben filtrar detalles internos (stack traces, mensajes de excepción)
server.error.include-stacktrace=never
server.error.include-message=never

# PostgreSQL: los datos de conexión vienen solo de variables de entorno (sin credenciales en el repo)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:youbeam}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# El esquema lo define deploy/db_init/db.sql; Hibernate solo lo valida, nunca lo modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Duración de una sesión desde el login
youbeam.session.duration=${SESSION_DURATION:8h}

# Tickets de reproducción (JWT ES256). La clave privada solo la tiene el Core; en producción es el
# Docker secret jwt_private. Nunca se genera una clave temporal fuera de los tests.
youbeam.jwt.private-key-locations=${JWT_PRIVATE_KEY_PATH:/run/secrets/jwt_private}
youbeam.jwt.ephemeral-key=false
youbeam.jwt.issuer=youbeam-core
youbeam.jwt.audience=youbeam-stream
youbeam.jwt.ticket-ttl=60s

# Streaming Server (red interna de Docker). El Core le reenvía la oferta WebRTC con el ticket.
youbeam.stream.base-url=${STREAM_URL:http://stream:8081}
youbeam.stream.connect-timeout=2s
youbeam.stream.read-timeout=10s

# Subida de videos. El multipart se resuelve en diferido para validar la sesión antes de leer el
# archivo, y Tomcat corta cualquier petición que supere el tamaño máximo.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:2GB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:2GB}
spring.servlet.multipart.resolve-lazily=true
# Cada subida usa un subdirectorio propio (permisos 700) que se borra al terminar
youbeam.upload.temp-dir=${UPLOAD_TEMP_DIR:${java.io.tmpdir}/youbeam-uploads}
youbeam.upload.allowed-content-types=video/mp4,video/webm,video/quicktime,video/x-matroska

# Transcodificación con ffmpeg (instalado en la imagen Docker). El ritmo de 30 fps coincide con el
# intervalo de 33 ms con que el Streaming Server envía los fotogramas.
youbeam.ffmpeg.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
youbeam.ffmpeg.ffprobe-path=${FFPROBE_PATH:ffprobe}
youbeam.ffmpeg.timeout=${FFMPEG_TIMEOUT:30m}
youbeam.ffmpeg.video-bitrate=2M
youbeam.ffmpeg.frame-rate=30

# Clave pública HPKE del Streaming Server (Docker secret hpke_public). El Core nunca tiene la privada.
youbeam.hpke.public-key-locations=${HPKE_PUBLIC_KEY_PATH:/run/secrets/hpke_public}

# Bucket MinIO de los videos cifrados (red interna de Docker). Las credenciales vienen solo de .env.
youbeam.minio.url=${MINIO_URL:http://minio:9000}
youbeam.minio.access-key=${MINIO_USER:}
youbeam.minio.secret-key=${MINIO_PASSWORD:}
youbeam.minio.bucket=${MINIO_BUCKET:videos}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# La documentación OpenAPI (Swagger UI y Scalar) está desactivada por defecto y solo se activa en el perfil dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
scalar.enabled=false
