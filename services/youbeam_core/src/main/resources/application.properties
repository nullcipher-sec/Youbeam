spring.application.name=youbeam-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${CORE_PORT:8080}
spring.threads.virtual.enabled=true

# Error responses must not leak internals (stack traces, exception messages)
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI docs are disabled by default and only enabled in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
