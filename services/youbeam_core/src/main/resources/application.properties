spring.application.name=youbeam-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${CORE_PORT:8080}
spring.threads.virtual.enabled=true

# Las respuestas de error no deben filtrar detalles internos (stack traces, mensajes de excepción)
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# La documentación OpenAPI está desactivada por defecto y solo se activa en el perfil dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
