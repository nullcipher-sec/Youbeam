# YouBeam - NGINX interno del cliente (SPA). Solo es accesible a través del NGINX de deploy/,
# que termina TLS y añade las cabeceras de seguridad.

server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Recursos con hash en el nombre (generados por Vite): se pueden cachear sin límite.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la SPA (/auth, /watch/<id>, ...): si no existe un archivo con ese nombre,
    # se sirve index.html y el enrutado lo resuelve App.tsx en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
