# YouBeam - NGINX, puerta de entrada del tráfico TCP.
#   :80   -> redirección a HTTPS (el puerto 80 no se publica; solo sirve /healthz al healthcheck)
#   :443  -> TLS 1.3;  /  -> client;  /api/ -> core
# El video no pasa por aquí: viaja por UDP 8443 (WebRTC) directo al Streaming Server.

server_tokens off;

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Cabeceras de seguridad (a nivel de server: los location no deben redefinir add_header)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Si la interfaz se ve rota, revisar la consola del navegador: un error de CSP indica qué origen falta.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Límite de tamaño de subida para videos
    client_max_body_size 500M;

    # API: se conserva el prefijo /api (el Core mapea /api/auth, /api/videos, ...).
    # OJO: sin "/" al final de proxy_pass; con "/" NGINX quitaría /api/ y todo daría 404.
    location /api/ {
        proxy_pass http://core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subidas grandes: no guardar todo el cuerpo en disco antes de reenviarlo
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
